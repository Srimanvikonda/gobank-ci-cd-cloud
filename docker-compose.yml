services:
  db:
    image: postgres:16
    container_name: gobank-postgres-compose
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgresql
      POSTGRES_DB: bankapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bankapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: gobank-app-compose
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: Postgresql
      DB_NAME: bankapp
      APP_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: